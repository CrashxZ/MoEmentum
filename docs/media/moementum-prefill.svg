<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Controlled prefill throughput</title>
<desc id="desc">Baseline versus MoEmentum on RTX 3050 6GB, 32GiB RAM, six vCPUs. Three samples per arm for each of four tasks. All bars share a zero-based 0 to 120 TPS scale.</desc>
<rect width="1000" height="620" rx="20" fill="#15283b"/>
<text x="42" y="52" font-family="Verdana,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f3f8fc">Same hardware. Less prefill time.</text>
<text x="42" y="86" font-family="Verdana,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#adbdce">RTX 3050 6GB / 32GiB RAM / 6 vCPUs / IQ2_M</text>
<rect x="44" y="108" width="14" height="14" fill="#899eb5"/>
<text x="66" y="121" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#d9e6f2">Pre-optimization baseline</text>
<rect x="335" y="108" width="14" height="14" fill="#5bc5d5"/>
<text x="358" y="121" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#d9e6f2">MoEmentum</text>
<path d="M230.0 151 V529" stroke="#31475c" stroke-width="1"/>
<text x="222.0" y="552" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#adbdce">0</text>
