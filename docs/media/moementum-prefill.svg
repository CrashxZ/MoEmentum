<path d="M518.0 151 V529" stroke="#31475c" stroke-width="1"/>
<text x="510.0" y="552" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#adbdce">60</text>
<path d="M662.0 151 V529" stroke="#31475c" stroke-width="1"/>
<text x="654.0" y="552" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#adbdce">90</text>
<path d="M806.0 151 V529" stroke="#31475c" stroke-width="1"/>
<text x="798.0" y="552" font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#adbdce">120</text>
